# 挖掘机作业范围图生成器 —— Nginx 站点配置（参考版）
# ⚠️ 线上实际用的是 /etc/nginx/sites-available/excavator，内容与这个文件**不一致**
#    （2026-10-04 核对）：线上有 443 + 自签证书的 server 块、静态资源缓存 7 天、
#    且没有 index.html 的 no-cache 块。要改线上配置务必先 `cat` 线上文件，
#    直接拿这个文件覆盖会把 443/SSL 段冲掉。
#
# 说明：
#   · 纯静态站点，不需要任何后端 / PHP / Node 运行时
#   · 只监听 80；如需 HTTPS 用 certbot 或阿里云证书服务另配 443
#   · 资源长缓存 + 入口页不缓存：改了 index.html 用户刷新即可看到新版本
#   · 关闭目录列表；隐藏 nginx 版本号

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /var/www/excavator;
    index index.html;

    charset utf-8;
    server_tokens off;
    autoindex off;

    # 安全响应头（纯静态站，不需要额外放开）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # gzip：HTML/CSS/JS/SVG 都能压掉 60% 以上
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json image/svg+xml application/xml;

    # 入口页不缓存，保证改版后立即生效
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    # 带内容指纹前先给较短缓存；资源目录整体一天
    location /assets/ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 隐藏文件一律拒绝
    location ~ /\. {
        deny all;
        return 404;
    }

    access_log /var/log/nginx/excavator.access.log;
    error_log  /var/log/nginx/excavator.error.log warn;
}
