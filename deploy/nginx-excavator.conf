# 挖掘机作业范围图生成器 —— Nginx 站点配置（参考版）
# ⚠️ 线上实际用的是 /etc/nginx/sites-available/excavator，内容与这个文件**不一致**
#    （2026-10-05 核对）：线上是「80 + 443 自签证书」两个 server 块、
#    且入口页没有 no-cache 块。要改线上配置务必先 `cat` 线上文件，
#    直接拿这个文件覆盖会把 443/SSL 段冲掉。
#
# 说明：
#   · 纯静态站点，不需要任何后端 / PHP / Node 运行时
#   · 只监听 80；如需 HTTPS 用 certbot 或阿里云证书服务另配 443
#   · 资源短缓存 + 入口页不缓存：改了 index.html 用户刷新即可看到新版本
#   · 关闭目录列表；隐藏 nginx 版本号
#
# 【缓存为什么是 5 分钟，而不是常见的 7 天/30 天】
#   资源文件名不带内容指纹（本项目零构建，没有打包器去改名），所以**长缓存必然会
#   把发版挡住**：2026-10-04 上线时用的是 7 天，结果手机端修复发出去以后，
#   老访客的浏览器攥着 7 天前缓存的那份 CSS/JS 根本不回源 —— 服务器上明明是新的，
#   用户看到的还是旧的（他们不会为了看更新去按 Ctrl+F5）。
#   ⚠️ 注意：**把服务器缓存改短并不能救回「已经缓存过」的访客** —— 浏览器在它自己
#   存下来的 max-age 到期前不会回源。所以 index.html 给 style.css / app.js 加了
#   ?v=<发版戳>（见 index.html / assets/ui/app.js 的注释），换一个它们没见过的 URL。
#   两者是配套的：?v= 负责把存量访客拉过来一次，5 分钟负责让**以后每次发版**都自动生效。
#   站点只有 15 个静态文件，5 分钟的额外开销可以忽略。

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /var/www/excavator;
    index index.html;

    charset utf-8;
    server_tokens off;
    autoindex off;

    # 安全响应头（纯静态站，不需要额外放开）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # gzip：HTML/CSS/JS/SVG 都能压掉 60% 以上
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json image/svg+xml application/xml;

    # 入口页不缓存，保证改版后立即生效
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    # 资源短缓存：5 分钟内重复访问走本地，之后回源校验（ETag → 304，几乎不传数据）
    location /assets/ {
        expires 5m;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 隐藏文件一律拒绝
    location ~ /\. {
        deny all;
        return 404;
    }

    access_log /var/log/nginx/excavator.access.log;
    error_log  /var/log/nginx/excavator.error.log warn;
}
