<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>挖掘机作业范围图生成器 · 反铲液压挖掘机作业尺寸在线计算</title>
<meta name="description" content="在线调整反铲液压挖掘机几何与液压参数，实时计算作业范围、作业尺寸和当前姿态理论挖掘力。">
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232563eb'/%3E%3Cpath d='M5 24h7l4-9 6-3' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M20 12l5 2-2 5z' fill='white'/%3E%3C/svg%3E">
<!--
  ?v= 是**发版戳**，用来把「已经缓存了旧版」的访客拉过来。
  线上静态资源曾在不知情的情况下被缓存 7 天（文件名不带内容指纹），浏览器在
  自己存的 max-age 到期前根本不会回源 —— 只把服务器的缓存时间调短是救不回这些人的，
  必须换一个它们没见过的 URL。
  现在线上缓存已改成 5 分钟（见 deploy/nginx-excavator.conf），任何带 ?v= 的 URL
  也会每 5 分钟回源校验一次，所以这个戳**不需要每次发版都改**；留着是为了万一
  又出现长缓存时能一键强推。
-->
<link rel="stylesheet" href="assets/style.css?v=20261005b">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      挖掘机作业范围图生成器
      <small>调整几何参数，实时生成反铲作业范围包络与作业尺寸</small>
    </div>
    <span class="spacer"></span>
    <div class="actions">
      <label class="no-print" style="font-size:12.5px;color:var(--text-2)">机型</label>
      <select class="btn" id="presetSelect" title="选择机型预设"></select>
      <button class="btn" id="btnReset" title="恢复到该机型的原始参数">重置</button>
      <button class="btn" id="btnShare" title="复制当前参数的分享链接">复制链接</button>
      <button class="btn" id="btnPng" title="导出高分辨率 PNG">导出 PNG</button>
      <button class="btn" id="btnSvg" title="导出矢量 SVG">导出 SVG</button>
      <button class="btn primary" id="btnPdf" title="调用浏览器打印，可另存为 PDF">打印 / PDF</button>
    </div>
  </header>

  <main>
    <aside class="panel" id="panel" aria-label="参数面板"></aside>

    <section class="canvas-wrap">
      <div class="canvas-toolbar no-print">
        <span class="tabs" style="display:inline-flex;gap:6px">
          <button class="btn" id="tabChart" data-tab="chart">作业范围图</button>
          <button class="btn" id="tabTable" data-tab="table">参数表</button>
        </span>
        <span style="width:1px;height:18px;background:var(--border)"></span>
        <span class="tabs" style="display:inline-flex;gap:6px">
          <button class="btn primary" id="btnOutline" title="按真机外形绘制（默认）">实体外形</button>
          <button class="btn" id="btnSchematic" title="按 GB/T 4460 机构运动简图符号绘制：构件画成杆件、铰点画成圆圈、油缸画成移动副">机构运动简图</button>
        </span>
        <span style="width:1px;height:18px;background:var(--border)"></span>
        <label><input type="checkbox" id="optEnvelope" checked> 包络线</label>
        <label><input type="checkbox" id="optDims" checked> 尺寸标注</label>
        <label><input type="checkbox" id="optBody" checked> 整机外形</label>
        <label><input type="checkbox" id="optTail" checked> 尾部回转圆</label>
        <label>姿态
          <select id="poseSelect">
            <option value="custom">工作姿态（可调）</option>
            <option value="maxDigHeight">最大挖掘高度</option>
            <option value="dumpHeight">最大卸载高度</option>
            <option value="maxDigDepth">最大挖掘深度</option>
            <option value="groundMaxRadius">停机面最大挖掘半径</option>
            <option value="none">不显示</option>
          </select>
        </label>
      </div>

      <div class="chart-hold">
        <!-- 缩放/平移只动 .chart-zoom 这一层：变换若写在 <svg> 上会被 exporter 序列化进导出文件 -->
        <div class="chart" id="chart">
          <div class="chart-zoom" id="chartZoom"></div>
          <div class="zoom-ctl no-print" id="zoomCtl">
            <button class="btn" id="zoomIn" aria-label="放大" title="放大（也可双指捏合 / 滚轮）">＋</button>
            <button class="btn" id="zoomOut" aria-label="缩小" title="缩小">－</button>
            <button class="btn" id="zoomReset" aria-label="恢复原始视图" title="恢复原始视图（也可双击图面）">⤢</button>
            <span class="zoom-level" id="zoomLevel">1×</span>
          </div>
        </div>

        <!-- 工作姿态（可调）：直接调三个油缸的长度，范围 = 安装距 ~ 安装距+行程 -->
        <div class="pose-ctl no-print" id="poseCtl" hidden>
          <div class="pose-ctl-title">油缸长度（工作姿态可调）</div>
          <div class="pose-row">
            <span class="pose-name">动臂油缸</span>
            <input type="range" id="slBoom" aria-label="动臂油缸长度">
            <span class="pose-val" id="valBoom">—</span>
          </div>
          <div class="pose-row">
            <span class="pose-name">斗杆油缸</span>
            <input type="range" id="slArm" aria-label="斗杆油缸长度">
            <span class="pose-val" id="valArm">—</span>
          </div>
          <div class="pose-row">
            <span class="pose-name">铲斗油缸</span>
            <input type="range" id="slBkt" aria-label="铲斗油缸长度">
            <span class="pose-val" id="valBkt">—</span>
          </div>
          <div class="pose-hint" id="poseHint">范围：安装距 ~ 安装距 + 行程</div>
          <button class="btn pose-reset" id="btnPoseReset" title="回到默认工作姿态">恢复默认姿态</button>
        </div>
      </div>
      <section class="force-summary" id="forceSummary" aria-label="当前姿态挖掘力" hidden>
        <div class="force-summary-title">当前姿态挖掘力</div>
        <div class="force-results">
          <div class="force-result"><span>铲斗收斗</span><strong><span id="forceBucketValue">—</span> kN</strong><small id="forceBucketDirection">—</small></div>
          <div class="force-result"><span>斗杆内收</span><strong><span id="forceArmValue">—</span> kN</strong><small id="forceArmDirection">—</small></div>
        </div>
        <div class="force-summary-note">当前姿态斗齿尖的单动作理论切向挖掘力。液压参数默认值仅供演示，请按真机资料填写；未计入自重、地面条件、泵流量限制、稳定性和结构约束，不作为实际作业能力或安全限值。</div>
      </section>
      <div class="table-wrap" id="tableWrap" hidden></div>
      <div class="perf" id="perf"></div>
    </section>
  </main>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<!-- 打印第二轮：参数表（屏幕上隐藏） -->
<div class="print-only" id="printOnly"></div>

<noscript>
  <p style="padding:24px;font-size:14px">本工具需要启用 JavaScript 才能实时计算并绘制作业范围图。</p>
</noscript>

<script type="module" src="assets/ui/app.js?v=20261005d"></script>
</body>
</html>
