<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>自检 · 挖掘机作业范围图生成器</title>
<style>
  body { font: 13px/1.6 Consolas, "Microsoft YaHei", monospace; margin: 0; padding: 12px 16px; background: #0f172a; color: #e2e8f0; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  .row { padding: 2px 0; white-space: pre-wrap; }
  .ok { color: #4ade80; }
  .bad { color: #f87171; font-weight: 700; }
  .info { color: #94a3b8; }
  #summary { font-size: 16px; font-weight: 700; padding: 8px 0 12px; }
  #stage { position: absolute; left: -4000px; top: 0; width: 1000px; height: 700px; }
</style>
</head>
<body>
<h1>浏览器端自检 —— 挖掘机作业范围图生成器</h1>
<div id="summary">运行中…</div>
<div id="out"></div>
<div id="stage"></div>

<script type="module">
import { PRESETS, clonePreset, getPreset } from '../assets/core/presets.js';
import { computeMetrics, METRIC_KEYS } from '../assets/core/metrics.js';
import { computeEnvelope, computeMinSwingRadius, envelopeExtremes } from '../assets/core/envelope.js';
import { solvePose } from '../assets/core/geometry.js';
import { validateParams, PARAM_SPEC } from '../assets/core/params.js';
import { armCylLength, armDeltaFromLength, armRodPerpInBoom, armRodPerpSpan, bucketCylLength, resolveJointRanges, boomCylBodyPoint, boomCylLength, cylinderPose, verifyCylinderLayout } from '../assets/core/cylinders.js';
import { encodeParams, decodeParams, buildShareUrl, matchPreset } from '../assets/core/share.js';
import { renderChart, resolvePose, cylinderLengthRange } from '../assets/ui/draw.js';
import { createChartZoom } from '../assets/ui/zoom.js';
import { renderSchematicFigure, schematicModel } from '../assets/ui/schematic.js';
import { renderSpecTables } from '../assets/ui/chart-table.js';
import { exportPng, exportSvg, serializeSvg, svgToCanvas, copyText, safeFilename } from '../assets/ui/exporter.js';

const out = document.getElementById('out');
const summary = document.getElementById('summary');
let pass = 0, fail = 0;
const failures = [];

function check(name, cond, detail = '') {
  const ok = !!cond;
  ok ? pass++ : fail++;
  if (!ok) failures.push(`${name}${detail ? ' [' + detail + ']' : ''}`);
  const div = document.createElement('div');
  div.className = 'row ' + (ok ? 'ok' : 'bad');
  div.textContent = `${ok ? 'PASS' : 'FAIL'}  ${name}${detail ? '   ' + detail : ''}`;
  out.appendChild(div);
  return ok;
}
function info(msg) {
  const div = document.createElement('div');
  div.className = 'row info';
  div.textContent = '      ' + msg;
  out.appendChild(div);
}
function section(t) {
  const div = document.createElement('div');
  div.className = 'row';
  div.style.cssText = 'color:#60a5fa;font-weight:700;padding-top:8px';
  div.textContent = '── ' + t;
  out.appendChild(div);
}

const stage = document.getElementById('stage');

async function main() {
  /* ---------------- 1. 指标与标定 ---------------- */
  section('指标计算');
  for (const m of PRESETS) {
    const v = validateParams(m);
    check(`${m.id} 参数校验通过`, v.ok, v.errors.join(';'));
    const { values } = computeMetrics(m);
    const all = { ...values, minSwingRadius: computeMinSwingRadius(m) };
    let worst = 0, worstKey = '';
    for (const [k, nom] of Object.entries(m.nominal ?? {})) {
      const d = Math.abs((all[k] - nom) / nom);
      if (d > worst) { worst = d; worstKey = k; }
    }
    check(
      `${m.id} 全部标称项偏差 ≤ 1%`,
      worst <= 0.01,
      `最大 ${(worst * 100).toFixed(3)}% (${worstKey})`,
    );
  }

  const sy = getPreset('x20t');
  const { values, poses } = computeMetrics(sy);
  check('20 吨级机型 停机面最大挖掘半径 = 9950', Math.abs(values.groundMaxRadius - 9950) < 50, values.groundMaxRadius.toFixed(0));
  check('20 吨级机型 最大挖掘深度 = 6600', Math.abs(values.maxDigDepth - 6600) < 33, values.maxDigDepth.toFixed(0));
  check('20 吨级机型 最大挖掘高度 = 9570', Math.abs(values.maxDigHeight - 9570) < 48, values.maxDigHeight.toFixed(0));
  check('20 吨级机型 最大卸载高度 = 6700', Math.abs(values.dumpHeight - 6700) < 34, values.dumpHeight.toFixed(0));

  /* ---------------- 2. 包络 ---------------- */
  section('包络求解（九段圆弧作图法）');
  const env = computeEnvelope(sy);
  const ex = envelopeExtremes(env);
  check('包络闭合', env.closed === true, env.closed ? '首尾相接' : '未闭合');
  check('九段圆弧依次相接', env.segments.length === 9 && env.segments.every((s, i) => i === 0 || s.ptFrom === env.segments[i - 1].ptTo + 1), `${env.segments.length} 段`);
  check('包络点数合理', env.outer.length > 40 && env.outer.length < 2000, `${env.outer.length} 点`);
  check('包络极值 = 最大挖掘高度 (2mm)', Math.abs(ex.maxY - values.maxDigHeight) < 2, `Δ=${(ex.maxY - values.maxDigHeight).toFixed(2)} mm`);
  check('包络极值 = 最大挖掘深度 (2mm)', Math.abs(ex.maxDepth - values.maxDigDepth) < 2, `Δ=${(ex.maxDepth - values.maxDigDepth).toFixed(2)} mm`);
  check('包络极值 = 最大挖掘半径 (2mm)', Math.abs(ex.maxX - values.maxDigRadius) < 2, `Δ=${(ex.maxX - values.maxDigRadius).toFixed(2)} mm`);
  {
    const types = ['bucket', 'boom', 'bucket', 'arm', 'bucket', 'boom', 'bucket', 'arm', 'bucket'];
    for (const m of PRESETS) {
      const rr = resolveJointRanges(m);
      const raw = computeEnvelope(m, { tol: 0 });
      check(`${m.id} 九段缸次序正确`, raw.segments.map((s) => s.which).join(',') === types.join(','));
      const p1 = solvePose(m, rr.alphaMax, rr.deltaMax, raw.segments[0].to);
      const d1 = Math.hypot(p1.T.x - p1.A.x, p1.T.y - p1.A.y)
        - (Math.hypot(p1.C.x - p1.A.x, p1.C.y - p1.A.y) + m.bucketRadius);
      check(`${m.id} ① 末 A–C–T 共线`, Math.abs(d1) < 1, `Δ=${d1.toFixed(2)} mm`);
      const p3 = solvePose(m, rr.alphaMin, rr.deltaMax, 0);
      const endpoint = raw.outer[raw.segments[2].ptTo];
      const d3 = Math.hypot(endpoint.x - p3.T.x, endpoint.y - p3.T.y);
      check(`${m.id} 新③ 末 B–C–T 共线且齿尖在 C 外侧`, d3 < 1e-6, `端点误差 ${d3.toFixed(6)} mm`);
      check(`${m.id} 新③ 顺时针转铲斗`, raw.segments[2].from > raw.segments[2].to && raw.segments[2].to === 0);
      const sweep = raw.segments[3];
      let maxError = 0;
      for (let i = sweep.ptFrom - 1; i <= sweep.ptTo; i++) {
        maxError = Math.max(maxError, Math.abs(Math.hypot(raw.outer[i].x - p3.B.x, raw.outer[i].y - p3.B.y) - m.armLength - m.bucketRadius));
      }
      check(`${m.id} 新④ 从 B–C–T 共线姿态连续描绘最大外伸圆弧`, maxError < 1e-6, `R=${m.armLength + m.bucketRadius} mm，误差 ${maxError.toFixed(6)} mm`);
      const p5 = solvePose(m, rr.alphaMin, rr.deltaMin, raw.segments[4].to);
      const d5 = Math.hypot(p5.T.x - p5.A.x, p5.T.y - p5.A.y)
        - Math.abs(Math.hypot(p5.C.x - p5.A.x, p5.C.y - p5.A.y) - m.bucketRadius);
      check(`${m.id} 新⑤ 末 A–T–C 共线`, Math.abs(d5) < 1, `Δ=${d5.toFixed(2)} mm`);
      if (m.id === 'E215HC4488A06A0') {
        const expected = m.armLength + m.bucketRadius - p3.B.y;
        const depth = envelopeExtremes(raw).maxDepth;
        check('E215 包络达到约 6296 mm 的实际可达最深点', Math.abs(expected - 6296) < 1 && Math.abs(depth - expected) < 1,
          `${depth.toFixed(3)} mm，解析解 ${expected.toFixed(3)} mm`);
      }
    }
  }
  check('动臂油缸活塞杆端取负值（在动臂两端点连线另一侧）', sy.boomCylRodPerp < 0, `${sy.boomCylRodPerp} mm`);
  {
    // 斗杆油缸活塞杆端必须全程落在动臂两端点连线 A–B 上方——这一条同时定出
    // 斗杆反解取圆交点的哪一支（见 cylinders.js 的 armBranchInfo）
    const sp = armRodPerpSpan(sy);
    check('斗杆油缸活塞杆端全程在动臂两端点连线 A–B 上方', sp.above,
      `行程内 ${sp.min.toFixed(0)} ~ ${sp.max.toFixed(0)} mm`);
    const rr2 = resolveJointRanges(sy);
    let allUp = true;
    for (let i = 0; i <= 100; i++) {
      const d = rr2.deltaMin + ((rr2.deltaMax - rr2.deltaMin) * i) / 100;
      if (!(armRodPerpInBoom(sy, d) > 0)) allUp = false;
    }
    check('斗杆全行程姿态下杆端都在连线上方', allUp, `Δ∈[${rr2.deltaMin.toFixed(1)}, ${rr2.deltaMax.toFixed(1)}]°`);
  }

  const t0 = performance.now();
  for (let i = 0; i < 5; i++) computeEnvelope(sy);
  const envMs = (performance.now() - t0) / 5;
  check('包络计算 < 30 ms（浏览器实测）', envMs < 30, `${envMs.toFixed(1)} ms`);

  const t1 = performance.now();
  for (let i = 0; i < 20; i++) computeMinSwingRadius(sy);
  const swMs = (performance.now() - t1) / 20;
  check('最小回转半径计算 < 30 ms', swMs < 30, `${swMs.toFixed(1)} ms`);

  /* ---------------- 3. 绘图 ---------------- */
  section('SVG 绘制');
  const host = document.createElement('div');
  host.style.cssText = 'width:1000px;height:700px';
  stage.appendChild(host);
  const svgText = renderChart({
    W: 1000, H: 700, p: sy, values, poses, env, view: {
      showEnvelope: true, showDims: true, showBody: true, showInner: true,
      showTailCircle: true, poseMode: 'custom', customPose: {},
      dimKeys: ['groundMaxRadius', 'maxDigHeight', 'dumpHeight', 'maxDigDepth', 'minSwingRadius'],
    }, minSwingRadius: values.minSwingRadius ?? computeMinSwingRadius(sy),
  });
  host.innerHTML = svgText;
  const svgEl = host.querySelector('svg');
  check('renderChart 产出 <svg> 元素', !!svgEl);
  check('SVG 中不含 NaN/undefined/Infinity', !/NaN|undefined|Infinity/.test(svgText));
  check('SVG 含包络路径', host.querySelectorAll('path').length >= 2, `${host.querySelectorAll('path').length} 条 path`);
  check('SVG 含机体多边形', host.querySelectorAll('polygon').length >= 4, `${host.querySelectorAll('polygon').length} 个 polygon`);
  const dimTexts = [...host.querySelectorAll('text')].map((t) => t.textContent).join('|');
  const mm = (v) => Math.round(v).toLocaleString('en-US');
  for (const [label, key] of [['最大挖掘高度', 'maxDigHeight'], ['最大卸载高度', 'dumpHeight'], ['最大挖掘深度', 'maxDigDepth'], ['停机面最大挖掘半径', 'groundMaxRadius']]) {
    check(`图上标注「${label} ${mm(values[key])}」`, dimTexts.includes(label) && dimTexts.includes(mm(values[key])));
  }
  const bbox = svgEl.getBBox();
  check('SVG 图形包围盒非空', bbox.width > 10 && bbox.height > 10, `${bbox.width.toFixed(0)}×${bbox.height.toFixed(0)}`);
  check('图形未超出画布 (1000×700)', bbox.x > -60 && bbox.y > -60 && bbox.x + bbox.width < 1060 && bbox.y + bbox.height < 760,
    `x∈[${bbox.x.toFixed(0)},${(bbox.x + bbox.width).toFixed(0)}] y∈[${bbox.y.toFixed(0)},${(bbox.y + bbox.height).toFixed(0)}]`);

  /* ---------------- 4. 导出 ---------------- */
  section('导出');
  const serialized = serializeSvg(svgEl);
  check('SVG 序列化含 xml 声明', serialized.startsWith('<?xml'));
  check('SVG 序列化含命名空间', serialized.includes('xmlns="http://www.w3.org/2000/svg"'));
  const reparsed = new DOMParser().parseFromString(serialized, 'image/svg+xml');
  check('序列化后的 SVG 可被解析且无解析错误', !reparsed.querySelector('parsererror'));
  check('序列化后仍含包络路径', reparsed.querySelectorAll('path').length >= 2, `${reparsed.querySelectorAll('path').length} 条`);

  let canvasOk = false, pngNote = '';
  try {
    const canvas = await svgToCanvas(svgEl, 1);
    const ctx = canvas.getContext('2d');
    const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    let nonWhite = 0;
    for (let i = 0; i < data.length; i += 4 * 97) {
      if (data[i] < 245 || data[i + 1] < 245 || data[i + 2] < 245) nonWhite++;
    }
    canvasOk = nonWhite > 200;
    pngNote = `${canvas.width}×${canvas.height}，非白像素采样 ${nonWhite}`;
  } catch (e) {
    pngNote = e.message;
  }
  check('SVG → Canvas 位图渲染成功（PNG 导出链路）', canvasOk, pngNote);

  let svgDownloaded = false;
  try {
    const orig = URL.createObjectURL;
    URL.createObjectURL = (b) => { svgDownloaded = b && b.size > 1000; return 'blob:stub'; };
    const origClick = HTMLAnchorElement.prototype.click;
    HTMLAnchorElement.prototype.click = function () {};
    exportSvg(svgEl, 'test.svg');
    URL.createObjectURL = orig;
    HTMLAnchorElement.prototype.click = origClick;
  } catch (e) { pngNote = e.message; }
  check('导出 SVG 触发下载且内容非空', svgDownloaded);

  /* ---------------- 5. 工作姿态（可调）与安装点跟随 ---------------- */
  section('工作姿态（可调）');
  for (const m of PRESETS) {
    const r = cylinderLengthRange(m, 'boom');
    check(`${m.id} 动臂油缸量程 = 安装距 ~ 安装距+行程`,
      Math.abs(r.min - m.boomCylClosed) < 1e-9 && Math.abs(r.max - (m.boomCylClosed + m.boomCylStroke)) < 1e-9,
      `${r.min.toFixed(0)} ~ ${r.max.toFixed(0)} mm`);
    const target = r.min + (r.max - r.min) * 0.62;
    const pose = resolvePose(m, { poseMode: 'custom', customPose: { boomL: target } }, computeMetrics(m).poses);
    const back = boomCylLength(m, pose.alphaDeg);
    check(`${m.id} 给动臂缸长度 → 姿态 → 长度能往返`, Math.abs(back - target) < 1,
      `${target.toFixed(0)} → α=${pose.alphaDeg.toFixed(2)}° → ${back.toFixed(0)} mm`);
  }
  {
    const frameOf = (p) => {
      const pose = computeMetrics(p).poses.maxDigHeight;
      const c = cylinderPose(p, pose);
      const t = (pose.alphaDeg * Math.PI) / 180;
      const dx = c.arm.body.x - pose.B.x;
      const dy = c.arm.body.y - pose.B.y;
      return { along: dx * Math.cos(t) + dy * Math.sin(t), perp: -dx * Math.sin(t) + dy * Math.cos(t) };
    };
    const base = PRESETS[0];
    const longer = { ...base, boomLength: base.boomLength + 900 };
    const o1 = frameOf(base);
    const o2 = frameOf(longer);
    check('加长动臂后斗杆缸缸筒端「自 B」坐标不变（跟着末端销孔走）',
      Math.abs(o1.along - o2.along) < 1e-6 && Math.abs(o1.perp - o2.perp) < 1e-6,
      `(${o1.along.toFixed(0)}, ${o1.perp.toFixed(0)}) → (${o2.along.toFixed(0)}, ${o2.perp.toFixed(0)})`);
    const frameOfArm = (p) => {
      const pose = computeMetrics(p).poses.maxDigHeight;
      const c = cylinderPose(p, pose);
      const t = (pose.armAbsDeg * Math.PI) / 180;
      const f = (q) => {
        const dx = q.x - pose.C.x;
        const dy = q.y - pose.C.y;
        return { along: dx * Math.cos(t) + dy * Math.sin(t), perp: -dx * Math.sin(t) + dy * Math.cos(t) };
      };
      return { D: f(c.rocker.pivot), P5: f(c.bucket.body) };
    };
    const a1 = frameOfArm(base);
    const a2 = frameOfArm({ ...base, armLength: base.armLength + 600 });
    check('加长斗杆后铲斗缸缸筒端 / 摇杆铰点「自 C」坐标不变（跟着末端销孔走）',
      Math.abs(a1.D.along - a2.D.along) < 1e-6 && Math.abs(a1.P5.along - a2.P5.along) < 1e-6,
      `D ${a1.D.along.toFixed(0)} → ${a2.D.along.toFixed(0)}，缸筒端 ${a1.P5.along.toFixed(0)} → ${a2.P5.along.toFixed(0)}`);
  }

  /* ---------------- 6. 机构运动简图 ---------------- */
  section('机构运动简图');
  const schView = {
    style: 'schematic',
    showEnvelope: true, showDims: true, showBody: true, showInner: false,
    showTailCircle: true, poseMode: 'custom', customPose: {},
    dimKeys: ['groundMaxRadius', 'maxDigHeight'],
  };
  const schHost = document.createElement('div');
  schHost.style.cssText = 'width:1000px;height:700px';
  stage.appendChild(schHost);
  const schText = renderChart({ W: 1000, H: 700, p: sy, values, poses, env, view: schView, minSwingRadius: computeMinSwingRadius(sy) });
  schHost.innerHTML = schText;
  const schSvg = schHost.querySelector('svg');
  check('机构简图模式产出 <svg> 且序列化后可解析',
    !!schSvg && !new DOMParser().parseFromString(serializeSvg(schSvg), 'image/svg+xml').querySelector('parsererror'));
  const dev = schHost.querySelector('[data-layer="device"]');
  const dcount = (sel) => (dev ? dev.querySelectorAll(sel).length : -1);
  check('构件层：转动副 12 个（11 铰点，P 为复合铰链画两个圈）', dcount('[data-sym="pin"]') === 12, `${dcount('[data-sym="pin"]')} 个`);
  check('构件层：机架支座 1 处（动臂根部 + 动臂油缸缸筒端 合为一个直角三角形）', dcount('[data-sym="frame"]') === 1, `${dcount('[data-sym="frame"]')} 处`);
  const frPts = schHost.querySelector('[data-sym="frame"] polygon')?.getAttribute('points')?.trim().split(/\s+/).map((s) => s.split(',').map(Number)) ?? [];
  check('机架三角形直角边平行坐标轴（图上实测）',
    frPts.length === 3 &&
    frPts.some((a, i) => frPts.some((b, j) => j !== i && Math.abs(a[0] - b[0]) < 0.01)) &&
    frPts.some((a, i) => frPts.some((b, j) => j !== i && Math.abs(a[1] - b[1]) < 0.01)),
    frPts.map((q) => `(${q[0].toFixed(0)},${q[1].toFixed(0)})`).join(' '));
  const bkPts = schHost.querySelector('[data-sym="bucket"]')?.getAttribute('points')?.trim().split(/\s+/) ?? [];
  check('铲斗是三个点的三角形（C / E / T）', bkPts.length === 3, `${bkPts.length} 个顶点`);
  check('构件层：液压缸（移动副）3 处', dcount('[data-sym="cylinder"]') === 3, `${dcount('[data-sym="cylinder"]')} 处`);
  check('构件层：摇杆 + 连杆 2 根两铰点杆', dcount('[data-sym="bar"]') === 2, `${dcount('[data-sym="bar"]')} 根`);
  check('构件层：动臂 + 斗杆 2 个多边形构件', dcount('[data-sym="link"]') === 2, `${dcount('[data-sym="link"]')} 个`);
  check('构件层：铲斗轮廓 1 个', dcount('[data-sym="bucket"]') === 1);
  const jointTexts = [...schHost.querySelectorAll('[data-joint]')].map((t) => t.getAttribute('data-joint'));
  check('图上标出 A/B/C/D/E/P 六个铰点编号', ['A', 'B', 'C', 'D', 'E', 'P'].every((k) => jointTexts.includes(k)), jointTexts.join(','));
  const legendText = [...schHost.querySelectorAll('text')].find((t) => t.textContent === '机构运动简图符号');
  const legendRect = legendText?.getBoundingClientRect();
  const schSvgRect = schSvg.getBoundingClientRect();
  check('图例确实画在画布内（不是只在字符串里）',
    !!legendRect && legendRect.width > 40 && legendRect.height > 5 &&
    legendRect.x > schSvgRect.x && legendRect.x + legendRect.width < schSvgRect.x + schSvgRect.width &&
    legendRect.y > schSvgRect.y && legendRect.y + legendRect.height < schSvgRect.y + schSvgRect.height,
    legendRect ? `图例 (${legendRect.x.toFixed(0)},${legendRect.y.toFixed(0)}) 画布 (${schSvgRect.x.toFixed(0)},${schSvgRect.y.toFixed(0)},${schSvgRect.width.toFixed(0)}×${schSvgRect.height.toFixed(0)})` : '未找到');

  // 参数表小图：图例条必须落在机构下方，不能盖住铲斗（曾经盖住过）
  const figPose = resolvePose(sy, { poseMode: 'custom', customPose: {} }, poses);
  const figSvg = renderSchematicFigure({ p: sy, pose: figPose });
  const figHost = document.createElement('div');
  stage.appendChild(figHost);
  figHost.innerHTML = figSvg;
  const figEl = figHost.querySelector('svg');
  check('参数表小图产出 <svg> 且良构',
    !!figEl && !new DOMParser().parseFromString(serializeSvg(figEl), 'image/svg+xml').querySelector('parsererror'));
  const drawRects = [...figHost.querySelectorAll('[data-layer="device"] [data-sym="pin"]')].map((c) => c.getBoundingClientRect().bottom);
  const legendRow = figHost.querySelector('[data-layer="legend"]')?.getBoundingClientRect();
  check('小图图例条在机构下方（不遮挡铲斗）',
    !!legendRow && drawRects.length > 0 && legendRow.top >= Math.max(...drawRects) - 6,
    legendRow ? `图例顶 ${legendRow.top.toFixed(0)} / 机构底 ${Math.max(...drawRects).toFixed(0)}` : '未找到图例');
  const model = schematicModel(sy, figPose);
  check('摇杆、连杆各只有两个铰点', model.links.find((l) => l.id === 'rocker').pts.length === 2 && model.links.find((l) => l.id === 'link').pts.length === 2);

  /* ---------------- 7. 参数表 ---------------- */
  section('参数表');
  const tables = renderSpecTables(sy, { ...values, minSwingRadius: computeMinSwingRadius(sy) }, poses, { showNominal: true });
  check('参数表含作业尺寸章节', tables.html.includes('作业尺寸'));
  check('参数表含几何参数章节', tables.html.includes('几何参数'));
  check('参数表含计算口径说明', tables.html.includes('计算口径'));
  check('参数表无 NaN', !/NaN/.test(tables.html));
  const tbl = document.createElement('div');
  tbl.innerHTML = tables.html;
  check('参数表渲染出行', tbl.querySelectorAll('tr').length > 30, `${tbl.querySelectorAll('tr').length} 行`);

  /* ---------------- 8. 分享链接 ---------------- */
  section('分享链接');
  const modified = clonePreset('x20t');
  modified.armLength = 2750;
  const q = encodeParams(modified);
  check('只写出改动项', q === 'm=x20t&al=2750', q);
  const back = decodeParams(q);
  check('往返后斗杆长度一致', back.armLength === 2750);
  check('往返后机型一致', back.id === 'x20t');
  check('未改动预设往返后仍能识别', matchPreset(decodeParams(encodeParams(clonePreset('x20t')))) === 'x20t');
  const full = buildShareUrl(modified, 'https://example.com/');
  check('分享链接可解析', decodeParams(full.slice(full.indexOf('?'))).armLength === 2750, full);

  const url = new URL(location.href);
  url.search = q;
  check('URLSearchParams 能解析生成的查询串', new URLSearchParams(url.search).get('al') === '2750');

  /* ---------------- 9. 交互一致性 ---------------- */
  section('交互一致性');
  const v1 = computeMetrics(sy).values;

  // 铰点坐标换成新口径后，只放大 boomLength 会让安装点相对杆件错位、关节角范围跑掉；
  // 「同型更大的机器」应当整套几何一起按比例放大，这里用整机缩放来验证单调性。
  const k = 6500 / sy.boomLength;
  const SCALE_KEYS = [
    'boomLength', 'armLength', 'bucketRadius', 'pivotX', 'pivotY',
    'boomCylBodyDX', 'boomCylBodyDY', 'boomCylRodAlong', 'boomCylRodPerp',
    'armCylBodyAlong', 'armCylBodyPerp', 'armCylRodAlong', 'armCylRodPerp',
    'bktCylBodyAlong', 'bktCylBodyPerp', 'bktBellAlong', 'bktBellPerp',
    'bktRockerLen', 'bktEAlong', 'bktEPerp', 'bktLinkLen',
    'boomCylClosed', 'boomCylStroke', 'armCylClosed', 'armCylStroke', 'bktCylClosed', 'bktCylStroke',
    'trackLength', 'trackWidth', 'platformFront',
  ];
  const bigger = { ...sy };
  for (const key of SCALE_KEYS) bigger[key] = sy[key] * k;
  const v2 = computeMetrics(bigger).values;
  const dR = v2.maxDigRadius - v1.maxDigRadius;
  check('整机放大 → 最大挖掘半径显著增大', dR > 500, `+${dR.toFixed(0)} mm (${((dR / v1.maxDigRadius) * 100).toFixed(1)}%)`);
  check('整机放大 → 最大挖掘高度增大', v2.maxDigHeight > v1.maxDigHeight, `${v1.maxDigHeight.toFixed(0)} → ${v2.maxDigHeight.toFixed(0)}`);

  // 斗杆加长则要按原标定角度重配斗杆油缸，否则关节角范围会整个跑掉
  const cal = sy.calibration;
  const longer = { ...sy, armLength: sy.armLength + 700 };
  const La = armCylLength(longer, cal.armRelMin);
  const Lb = armCylLength(longer, cal.armRelMax);
  longer.armCylClosed = Math.min(La, Lb);
  longer.armCylStroke = Math.abs(Lb - La);
  const v3 = computeMetrics(longer).values;
  check('斗杆加长 700（重配油缸）→ 最大挖掘深度 +700', Math.abs((v3.maxDigDepth - v1.maxDigDepth) - 700) < 2, `+${(v3.maxDigDepth - v1.maxDigDepth).toFixed(0)}`);

  /* ---------------- 10. 油缸布置口径与自检 ---------------- */
  section('油缸布置口径');
  for (const m of PRESETS) {
    const layout = verifyCylinderLayout(m);
    const bad = layout.checks.filter((c) => !c.ok);
    check(`${m.id} 布置自检全部通过（含安裝点口径 / 伸出方向 / 干涉）`, bad.length === 0,
      bad.map((c) => `${c.label}(${c.detail})`).join('；') || `${layout.checks.length} 项`);
    check(`${m.id} 动臂油缸缸筒端在 A 前下方`, m.boomCylBodyDX > 0 && m.boomCylBodyDY < 0, `A+(${m.boomCylBodyDX}, ${m.boomCylBodyDY})`);
    check(`${m.id} 斗杆油缸活塞杆端沿斗杆为负、垂直斗杆为正`, m.armCylRodAlong < 0 && m.armCylRodPerp > 0, `(${m.armCylRodAlong}, ${m.armCylRodPerp})`);
    check(`${m.id} 铲斗油缸与摇杆都在斗杆上方`, m.bktCylBodyPerp > 0 && m.bktBellPerp > 0, `${m.bktCylBodyPerp} / ${m.bktBellPerp}`);
    check(`${m.id} 摇杆/连杆长度在真机量级`,
      m.bktRockerLen > 0.08 * m.armLength && m.bktRockerLen < 0.38 * m.armLength &&
      m.bktLinkLen > 0.12 * m.armLength && m.bktLinkLen < 0.55 * m.armLength,
      `摇杆 ${m.bktRockerLen} / 连杆 ${m.bktLinkLen}（斗杆 ${m.armLength}）`);
    check(`${m.id} 连杆销落在斗背板上`,
      m.bktEAlong < 0 && m.bktEAlong > -0.4 * m.bucketRadius &&
      m.bktEPerp > 0.2 * m.bucketRadius && m.bktEPerp < 0.8 * m.bucketRadius,
      `(${m.bktEAlong}, ${m.bktEPerp}) / R3=${m.bucketRadius}`);
    const body = boomCylBodyPoint(m);
    check(`${m.id} 缸筒端整机坐标 = A + (ΔX, ΔY)`,
      Math.abs(body.x - (m.pivotX + m.boomCylBodyDX)) < 1e-9 && Math.abs(body.y - (m.pivotY + m.boomCylBodyDY)) < 1e-9,
      `(${body.x.toFixed(0)}, ${body.y.toFixed(0)})`);
    const R = resolveJointRanges(m);
    check(`${m.id} 斗杆油缸伸出 → 收拢`, armCylLength(m, R.deltaMin) > armCylLength(m, R.deltaMax));
    check(`${m.id} 铲斗油缸伸出 → 收斗`, bucketCylLength(m, R.psiCurl) > bucketCylLength(m, R.psiDump));
  }

  {
    // 回归：改造前「逐缸长判支」在这组参数上会把杆端全程放到 A–B 连线下方
    // （图上斗杆整支翻面）。现在按装配支一次定支，必须全程在上方且不跳支。
    const p = {
      ...sy, boomLength: 7300, armCylBodyAlong: -4325, armCylBodyPerp: 1180,
      armCylRodAlong: -1525, armCylRodPerp: 225, armCylClosed: 3075, armCylStroke: 1400,
    };
    const Lc = Math.min(p.armCylClosed, p.armCylClosed + p.armCylStroke);
    const Lo = Math.max(p.armCylClosed, p.armCylClosed + p.armCylStroke);
    let ok = true, prev = null, dir = 0, folds = 0;
    for (let i = 0; i <= 100; i++) {
      const d = armDeltaFromLength(p, Lc + ((Lo - Lc) * i) / 100);
      if (!Number.isFinite(d) || !(armRodPerpInBoom(p, d) > 0)) ok = false;
      if (prev !== null) {
        const s = Math.sign(d - prev);
        if (s !== 0) { if (!dir) dir = s; else if (s !== dir) folds++; }
      }
      prev = d;
    }
    check('斗杆反解按装配支定支（回归：不得选到连线下方那支）', ok && folds === 0,
      ok ? (folds === 0 ? '全程在上方且单调' : `中途跳支 ${folds} 次`) : '有采样点落在连线下方');
  }

  {
    // 预设参数必须落在滑块区间内：区间收窄而预设没跟着改时，界面会把它夹到边界，
    // 显示的就不是预设几何了（指标跟着漂）。同时钉住本次要求的垂直动臂区间。
    const out = [];
    for (const m of PRESETS) {
      for (const spec of PARAM_SPEC) {
        const v = m[spec.key];
        if (v !== undefined && (v < spec.min || v > spec.max)) out.push(`${m.id}.${spec.key}=${v}∉[${spec.min},${spec.max}]`);
      }
    }
    check('预设参数全部落在滑块区间内', out.length === 0, out.join('；') || `${PRESETS.length} 个机型`);
    const rodSpec = PARAM_SPEC.find((s) => s.key === 'boomCylRodPerp');
    check('活塞杆端 垂直动臂 区间为 −1000 ~ +1000', rodSpec.min === -1000 && rodSpec.max === 1000, `[${rodSpec.min}, ${rodSpec.max}]`);
  }

  check('参数表含铰点坐标对照表', tables.html.includes('铰点坐标对照'));
  check('参数表含布置自检表', tables.html.includes('油缸布置自检'));
  check('参数表标出杆端相对 A–B 连线的位置', tables.html.includes('相对 A–B 连线'));
  check('参数表规格数量与 PARAM_SPEC 一致', PARAM_SPEC.length === 48, `${PARAM_SPEC.length} 项`);
  check('指标键完整', METRIC_KEYS.length === 5);
  check('safeFilename 生成安全文件名', !/[\\/:*?"<>|\s]/.test(safeFilename('某 20 吨级挖掘机/测试*', 'png')), safeFilename('某 20 吨级挖掘机/测试*', 'png'));

  /* ---------------- 8. 窄屏与缩放 ---------------- */
  section('窄屏与缩放');
  {
    // 这一节补的是「Node 里测不到」的那一层：真实字形盒与真实布局。
    // 背景：手机端曾经完全看不到作业范围图（画布被 CSS 挤到 0 高，
    // app.js 的 W<40||H<40 兜底静默跳过绘制），而当时所有自动化都只跑桌面尺寸。
    const DIMS = ['groundMaxRadius', 'maxDigHeight', 'dumpHeight', 'maxDigDepth', 'minSwingRadius'];
    const narrowView = {
      showEnvelope: true, showDims: true, showBody: true, showInner: false,
      showTailCircle: true, poseMode: 'custom', customPose: {}, dimKeys: DIMS,
    };

    for (const [W, H] of [[320, 320], [360, 460], [390, 460], [844, 390]]) {
      const host2 = document.createElement('div');
      host2.style.cssText = `width:${W}px;height:${H}px`;
      stage.appendChild(host2);
      host2.innerHTML = renderChart({
        W, H, p: sy, values, poses, env,
        view: narrowView,
        minSwingRadius: values.minSwingRadius ?? computeMinSwingRadius(sy),
      });
      const svgN = host2.querySelector('svg');
      check(`窄屏 ${W}×${H} 渲染出 <svg>`, !!svgN);
      if (!svgN) continue;
      const bb = svgN.getBBox();
      // 真实字形盒：Node 里只能用估算宽度近似，这里用浏览器算
      check(
        `窄屏 ${W}×${H} 图形与文字都在画布内`,
        bb.x >= -1 && bb.y >= -1 && bb.x + bb.width <= W + 1 && bb.y + bb.height <= H + 1,
        `bbox x∈[${bb.x.toFixed(1)},${(bb.x + bb.width).toFixed(1)}] y∈[${bb.y.toFixed(1)},${(bb.y + bb.height).toFixed(1)}]`,
      );
      host2.remove();
    }

    // 缩放/平移控制器：真实 DOM、真实布局
    const zoomHost = document.createElement('div');
    zoomHost.style.cssText = 'position:relative;width:390px;height:460px;overflow:hidden';
    const zoomContent = document.createElement('div');
    zoomContent.style.cssText = 'width:100%;height:100%';
    zoomHost.appendChild(zoomContent);
    stage.appendChild(zoomHost);

    const z = createChartZoom({ host: zoomHost, content: zoomContent });
    check('createChartZoom：初始为单位变换', z.getTransform().k === 1 && z.getTransform().tx === 0, JSON.stringify(z.getTransform()));
    check('createChartZoom：初始 transform 为单位阵', /matrix\(1, 0, 0, 1, 0, 0\)/.test(getComputedStyle(zoomContent).transform));

    z.zoomBy(2);
    const t2 = z.getTransform();
    check('zoomBy(2)：k 变为 2 且位移被钳在界内', Math.abs(t2.k - 2) < 1e-6 && t2.tx <= 0 && t2.tx >= -390 * 1, JSON.stringify(t2));
    check('zoomBy(2)：加了 is-zoomed 类（触摸交给图、页面不跟着滚）', zoomHost.classList.contains('is-zoomed'));

    z.reset();
    const t1 = z.getTransform();
    check('reset()：回到 1× 且位移归零', t1.k === 1 && t1.tx === 0 && t1.ty === 0, JSON.stringify(t1));
    check('reset()：移除 is-zoomed 类', !zoomHost.classList.contains('is-zoomed'));

    // 拖到极远处也不能把图拖出视野
    z.zoomBy(3);
    z.zoomBy(1, -99999, -99999);
    const tc = z.getTransform();
    check('钳制：内容始终盖满视口（tx∈[W−W·k, 0]）',
      tc.tx <= 0 && tc.tx >= 390 - 390 * tc.k - 1e-6 && tc.ty <= 0 && tc.ty >= 460 - 460 * tc.k - 1e-6,
      JSON.stringify(tc));
    z.reset();
    z.destroy();
    zoomHost.remove();
  }

  /* ---------------- 应用事件接线 ---------------- */
  section('应用交互与打印');
  const frame = document.createElement('iframe');
  // 保持在视口内但透明，避免浏览器暂停离屏 iframe 的动画帧。
  frame.style.cssText = 'position:fixed;left:0;top:0;width:1000px;height:700px;opacity:0;pointer-events:none;border:0';
  try {
    await new Promise((resolve, reject) => {
      frame.onload = resolve;
      frame.onerror = () => reject(new Error('应用自检页面加载失败'));
      frame.src = '../index.html';
      document.body.appendChild(frame);
    });
    const win = frame.contentWindow;
    const doc = frame.contentDocument;
    const nextFrame = () => new Promise((resolve) => win.requestAnimationFrame(resolve));
    await nextFrame();
    await nextFrame();
    check('真实应用首次绘制出作业范围图', !!doc.querySelector('#chart svg'));

    let printCalls = 0;
    win.print = () => {
      printCalls++;
      if (printCalls === 1) win.dispatchEvent(new win.Event('beforeprint'));
    };
    win.dispatchEvent(new win.Event('beforeprint'));
    await new Promise((resolve) => win.setTimeout(resolve, 100));
    check('Ctrl+P 的 beforeprint 准备参数表', !!doc.querySelector('#printOnly table'));
    check('beforeprint 不再次调用打印', printCalls === 0, `调用 ${printCalls} 次`);
    printCalls = 0;
    doc.getElementById('btnPdf').click();
    await new Promise((resolve) => win.setTimeout(resolve, 100));
    check('打印按钮只调用一次打印', printCalls === 1, `调用 ${printCalls} 次`);

    const originalRaf = win.requestAnimationFrame.bind(win);
    let scheduledFrames = 0;
    win.requestAnimationFrame = (callback) => {
      scheduledFrames++;
      return originalRaf(callback);
    };
    const changeBoom = (value) => {
      const input = doc.getElementById('f-boomLength');
      input.value = String(value);
      input.dispatchEvent(new win.Event('change', { bubbles: true }));
    };
    changeBoom(sy.boomLength + 100);
    changeBoom(sy.boomLength + 200);
    doc.getElementById('tabTable').click();
    doc.getElementById('tabChart').click();
    // 使用原始 rAF 等待，不把自检自身算进应用注册的帧数。
    await new Promise((resolve) => originalRaf(resolve));
    check('同帧多次参数修改与视图切换只注册一次绘制', scheduledFrames === 1, `注册 ${scheduledFrames} 帧`);
    const expected = computeMetrics({ ...sy, boomLength: sy.boomLength + 200 }).values.groundMaxRadius;
    check('视图切换不丢失待执行的参数计算', doc.querySelector('#chart svg').textContent.includes(Math.round(expected).toLocaleString('en-US')));
    changeBoom(sy.boomLength);
    await new Promise((resolve) => originalRaf(resolve));
    const before = doc.getElementById('perf').textContent.split(' · 绘制')[0];
    doc.getElementById('tabTable').click();
    doc.getElementById('tabChart').click();
    await new Promise((resolve) => originalRaf(resolve));
    check('仅切换页签保留既有计算结果', doc.getElementById('perf').textContent.split(' · 绘制')[0] === before);

    const validSvg = doc.querySelector('#chart svg').outerHTML;
    const bucketInput = doc.getElementById('f-bktEPerp');
    bucketInput.value = '535'; // 已知不能覆盖完整铲斗油缸行程的参数。
    bucketInput.dispatchEvent(new win.Event('change', { bubbles: true }));
    await new Promise((resolve) => originalRaf(resolve));
    check('参数无效时保留有效图、隐藏当前挖掘力并显示状态',
      doc.querySelector('#chart svg').outerHTML === validSvg && doc.getElementById('forceSummary').hidden && doc.getElementById('perf').textContent.includes('参数无效'));
    doc.getElementById('tabTable').click();
    doc.getElementById('tabChart').click();
    doc.getElementById('optEnvelope').click();
    await new Promise((resolve) => originalRaf(resolve));
    await new Promise((resolve) => originalRaf(resolve));
    check('无效参数下切换视图仍保留最后一张有效图', doc.querySelector('#chart svg').outerHTML === validSvg);
  } finally {
    frame.remove();
  }

  /* ---------------- 汇总 ---------------- */
  summary.textContent = fail === 0
    ? `✅ 全部通过：${pass} 项`
    : `❌ ${fail} 项失败 / 共 ${pass + fail} 项 → ` + failures.join(' ⏐ ');
  summary.className = fail === 0 ? 'ok' : 'bad';
  document.title = (fail === 0 ? 'SELFTEST-OK ' : 'SELFTEST-FAIL ') + `${pass}/${pass + fail}`;
  window.scrollTo(0, 0);
}

main().catch((e) => {
  summary.textContent = '自检脚本异常：' + e.message;
  summary.className = 'bad';
  const d = document.createElement('div');
  d.className = 'row bad';
  d.textContent = e.stack;
  out.appendChild(d);
});
</script>
</body>
</html>
